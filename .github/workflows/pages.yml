name: Deploy to GitHub Pages

# PRE-LAUNCH: manual runs only. The site is intentionally offline (Pages disabled, DNS records
# removed) until launch. At launch, put the push trigger back (see DEPLOY.md > Go live).
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

# Default to read-only; each job widens only to what it actually needs. The build job
# runs third-party code (npm ci), so it does NOT get id-token: write. Only the deploy
# job, which runs no untrusted code, can mint an OIDC token.
permissions:
  contents: read

# Let a running deploy finish rather than cancelling it: a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      # Actions are pinned to full commit SHAs, not tags (tags are mutable).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Pinned major; Astro 7 needs Node 22+.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check + build (astro check && astro build)
        run: npm run build
        env:
          # Public by design (it is inlined into the page and only allows emailing Gene@). Repo variable, not a secret.
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}

      - name: Sanity-check the build output
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/404.html || { echo "::error::dist/404.html missing (GitHub Pages uses it for not-found pages)"; exit 1; }
          grep -qx 'palmbeachaiservices.com' dist/CNAME || { echo "::error::dist/CNAME missing or wrong"; exit 1; }
          # The Google check form must actually deliver leads: fail if the Web3Forms key did not make it into the bundle.
          test -n "$PUBLIC_WEB3FORMS_KEY" || { echo "::error::PUBLIC_WEB3FORMS_KEY repo variable is empty; the form would not send leads"; exit 1; }
          grep -rq "$PUBLIC_WEB3FORMS_KEY" dist/free-google-check/ || { echo "::error::Web3Forms key missing from /free-google-check/"; exit 1; }
          grep -q 'Content-Security-Policy' dist/index.html || { echo "::error::CSP meta tag missing"; exit 1; }

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
